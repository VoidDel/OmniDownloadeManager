[package]
name = "omnidl-ipc"
description = "Messages between the browser bridge and the Omni Download app, and their framing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The async server the app runs (the Native Messaging host uses the blocking client only).
tokio = ["dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "io-util", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros"] }
