[package]
name = "omnidl-nm-host"
description = "Native Messaging host that connects the browser extensions to Omni Download."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Small and quick to start: the browser starts one for every message (no async runtime).
[dependencies]
omnidl-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
omnidl-ipc = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros"] }
