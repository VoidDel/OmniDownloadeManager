[package]
name = "omnidl-http"
description = "HTTP/HTTPS download engine of Omni Download: multi-connection segments and resume."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
omnidl-core.workspace = true
omnidl-storage.workspace = true
# HLS segments encrypted with AES-128 (CBC on top of the block cipher; the version already in
# the tree).
aes = "0.9"
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
httpdate.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
# The client nonce of Digest authentication.
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
uuid.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
# The bench example's log (RUST_LOG).
tracing-subscriber.workspace = true
