[package]
name = "omnidl-desktop"
description = "Omni Download desktop application (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "omnidl_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "omnidl-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
omnidl-core.workspace = true
omnidl-storage.workspace = true
omnidl-http.workspace = true
omnidl-bt.workspace = true
omnidl-ftp.workspace = true
# The browser bridge.
omnidl-ipc = { workspace = true, features = ["tokio"] }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-deep-link.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true
