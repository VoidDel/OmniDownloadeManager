[package]
name = "omnidl-desktop"
description = "Omni Download desktop application (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "omnidl_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "omnidl-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
omnidl-core.workspace = true
omnidl-storage.workspace = true
omnidl-http.workspace = true
omnidl-bt.workspace = true
omnidl-ftp.workspace = true
# The browser bridge.
omnidl-ipc = { workspace = true, features = ["tokio"] }
# The notification-area icon, and its "busy" variant drawn at run time.
# macos-private-api: the floating ball's transparent window on macOS.
tauri = { workspace = true, features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-updater.workspace = true
# The system language, for the notification-area menu and notifications ("auto").
sys-locale = "0.3"
# Release dates of updates.
time = { version = "0.3", features = ["formatting"] }
# Local time for scheduled downloads.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
url.workspace = true
# Reading the clipboard when watching it (text only).
arboard = { version = "3", default-features = false }
uuid.workspace = true

# Notifications: WinRT toasts on Windows (clicking one shows the file), the plugin elsewhere.
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-registry = "0.100"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_Media_Audio", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true
